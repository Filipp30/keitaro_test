<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Keitaro wrapper</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>Keitaro wrapper</h1>
  <nav>
    <button class="tab active" data-tab="create">Создать кампанию</button>
    <button class="tab" data-tab="editor">Редактор офферов</button>
  </nav>
</header>

<main>
  <!-- Part 1: campaign builder -->
  <section id="tab-create" class="panel">
    <form id="create-form" class="card">
      <h2>Новая кампания</h2>
      <label>Название кампании
        <input name="name" required maxlength="255" placeholder="test_campaign">
      </label>
      <label>Страна (гео)
        <input name="country" required maxlength="2" placeholder="DE" list="countries" class="upper">
        <datalist id="countries"></datalist>
        <small>Двухбуквенный ISO-код. Трафик из этой страны уходит на Google.</small>
      </label>
      <label>Оффер
        <select name="offer_id" required></select>
      </label>
      <div class="row">
        <label>Группа <select name="group_id" required></select></label>
        <label>Домен <select name="domain_id" required></select></label>
        <label>Источник <select name="traffic_source_id" required></select></label>
      </div>
      <button type="submit" class="primary">Создать</button>
      <div id="create-result" class="result" hidden></div>
    </form>

    <div class="card">
      <h2>Созданные кампании</h2>
      <table id="created-table">
        <thead><tr><th>ID</th><th>Название</th><th>Гео</th><th>Оффер</th><th>Ссылка</th><th>Создана</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <!-- Part 2: offer editor -->
  <section id="tab-editor" class="panel" hidden>
    <div class="card">
      <h2>Кампания</h2>
      <div class="row">
        <label>Группа
          <select id="filter-group"><option value="">Все группы</option></select>
        </label>
        <label>Поиск
          <input id="filter-search" placeholder="Название или ID">
        </label>
      </div>
      <label>Кампания
        <select id="campaign-select"><option value="">— выберите кампанию —</option></select>
      </label>
    </div>

    <div id="campaign-view"></div>
  </section>
</main>

<div id="toast" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
